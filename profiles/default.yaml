# Профиль по умолчанию. Формат — README.md рядом с инспектором.
#
# Правила накопительные: срабатывают все совпавшие, действия складываются в
# порядке строк. Пустой match совпадает со всяким запросом профиля.
#
# Пример 1: смягчить modsec на доверенном маршруте. delta — проценты
# коэффициента к счёту, который он отдаёт модулю: минус — скидка (намерял на
# 50, с -50 отдал 25), плюс — поведение клиента дороже. Пороги — и его, и
# маршрута — не двигаются. Коэффициент не действует, пока в профиле modsec
# нет правила приёма from: "action" с accept: [threshold]: канал
# рекомендательный.
#
#   - name: calm-modsec-healthz
#     match:
#       path_prefix: "/healthz"
#     actions:
#       - to: modsec
#         do: threshold
#         delta: -50
#         code: ROUTE_TRUSTED
#
# Пример 2: рассказать капче, что клиент подгружает статику — живой браузер
# делает это, боты обычно нет. Что сделать с фактом (сбросить счётчик, понизить
# подозрительность адреса), решает профиль капчи: код с отрицательным весом
# назначается у неё, на проводе послаблений нет.
#
#   - name: static-fetch
#     match:
#       static: true
#       methods: [GET]
#     actions:
#       - to: captcha
#         do: note
#         apply: ip
#         code: STATIC_FETCH
#         value: 10

mode: enforce
rules: []
